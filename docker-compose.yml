version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: outbox_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 5s
      retries: 5
      start_period: 10s
      timeout: 10s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: outbox_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: kafka-topics --bootstrap-server kafka:9092 --list || exit 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    depends_on:
      zookeeper:
        condition: service_healthy

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: outbox_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...'
        kafka-topics --bootstrap-server kafka:9092 --list

        echo 'Creating topics...'
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --partitions 1 --replication-factor 1

        echo 'Topics created:'
        kafka-topics --bootstrap-server kafka:9092 --list
      "
    restart: on-failure

  mongodb:
    image: mongo:latest
    container_name: outbox_mongodb
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017" ]
    ports:
      - "27017:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - mongodb_data:/data/db

  producer:
    container_name: outbox_producer
    build:
      context: .
      dockerfile: producer/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongodb:27017/?directConnection=true
      - MONGO_HOST=mongodb
    restart: unless-stopped

  relay:
    container_name: outbox_relay
    build:
      context: .
      dockerfile: relay/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - MONGO_URI=mongodb://mongodb:27017/?directConnection=true
      - MONGO_HOST=mongodb
      - KAFKA_BROKERS=kafka:9092
    restart: unless-stopped

  consumer:
    container_name: outbox_consumer
    build:
      context: .
      dockerfile: consumer/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - MONGO_URI=mongodb://mongodb:27017/?directConnection=true
      - MONGO_HOST=mongodb
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=orders
      - KAFKA_GROUP_ID=order-consumer-group
    restart: unless-stopped

volumes:
  mongodb_data: